name: Deploy

# Plans on pull requests, applies on merge to main, and supports manual
# plan/apply/destroy. Authenticates to AWS via GitHub OIDC — no stored
# credentials. All jobs skip cleanly until the repository variables
# AWS_DEPLOY_ROLE_ARN, TF_STATE_BUCKET and AWS_REGION are configured
# (see bootstrap/README.md).

on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write
  contents: read

# Serialise anything that touches the shared state
concurrency:
  group: terraform-playground
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: terraform plan
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'plan'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sre-terraform-challenge/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: terraform plan
        run: terraform plan -input=false -var="aws_region=${{ vars.AWS_REGION }}"

  apply:
    name: terraform apply
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: ubuntu-latest
    environment: playground
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sre-terraform-challenge/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: terraform apply
        run: terraform apply -input=false -auto-approve -var="aws_region=${{ vars.AWS_REGION }}"
      - name: Show outputs
        run: terraform output

  destroy:
    name: terraform destroy
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: playground
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sre-terraform-challenge/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve -var="aws_region=${{ vars.AWS_REGION }}"
